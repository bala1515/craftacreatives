<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" fill="none">
  <defs>
    <linearGradient id="printBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="50%" stop-color="#211F24" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FDF0CD" />
    </linearGradient>
    <linearGradient id="cmykCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0071E3" />
    </linearGradient>
    <radialGradient id="printAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#printBg)" />
  <rect width="1000" height="650" fill="url(#printAura)" />

  <!-- CMYK Registration Marks -->
  <g opacity="0.4" stroke="#D4AF37" stroke-width="1">
    <!-- Top-left register -->
    <circle cx="60" cy="60" r="14" fill="none" />
    <line x1="40" y1="60" x2="80" y2="60" />
    <line x1="60" y1="40" x2="60" y2="80" />

    <!-- Top-right register -->
    <circle cx="940" cy="60" r="14" fill="none" />
    <line x1="920" y1="60" x2="960" y2="60" />
    <line x1="940" y1="40" x2="940" y2="80" />

    <!-- Bottom-left register -->
    <circle cx="60" cy="590" r="14" fill="none" />
    <line x1="40" y1="590" x2="80" y2="590" />
    <line x1="60" y1="570" x2="60" y2="610" />

    <!-- Bottom-right register -->
    <circle cx="940" cy="590" r="14" fill="none" />
    <line x1="920" y1="590" x2="960" y2="590" />
    <line x1="940" y1="570" x2="940" y2="610" />
  </g>

  <!-- CMYK Color Swatches Bar -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="22" height="14" fill="#00FFFF" rx="2" />
    <rect x="26" y="0" width="22" height="14" fill="#FF00FF" rx="2" />
    <rect x="52" y="0" width="22" height="14" fill="#FFFF00" rx="2" />
    <rect x="78" y="0" width="22" height="14" fill="#000000" stroke="#333" rx="2" />
    <text x="110" y="12" fill="#8E8E93" font-family="monospace" font-size="11">CMYK PRESS READY • 300 DPI</text>
  </g>

  <!-- 3D Luxury Foil-Stamped Business Cards / Packaging Layer -->
  <g transform="translate(500, 310)">
    <!-- Card 1 (Underneath Matte Dark Gray Card) -->
    <g transform="rotate(-12)">
      <rect x="-240" y="-140" width="420" height="250" rx="16" fill="#1C1C1E" stroke="#38383A" stroke-width="2" />
      <!-- Embossed lines -->
      <line x1="-200" y1="-80" x2="-60" y2="-80" stroke="#48484A" stroke-width="3" stroke-linecap="round" />
      <line x1="-200" y1="-50" x2="-100" y2="-50" stroke="#38383A" stroke-width="2" stroke-linecap="round" />
      <text x="-200" y="60" fill="#636366" font-family="sans-serif" font-size="14" font-weight="700">PREMIUM 600 GSM</text>
      <text x="-200" y="82" fill="#48484A" font-family="sans-serif" font-size="12">SOFT TOUCH VELVET MATTE</text>
    </g>

    <!-- Card 2 (Top Card with Metallic Gold Foil Stamping) -->
    <g transform="rotate(6)">
      <!-- Drop Shadow -->
      <rect x="-200" y="-120" width="420" height="250" rx="16" fill="#000000" opacity="0.5" transform="translate(10, 16)" />
      
      <!-- Card Body -->
      <rect x="-200" y="-120" width="420" height="250" rx="16" fill="#0D0D0E" stroke="#2C2C2E" stroke-width="2" />
      
      <!-- Gold Foil Border Inset -->
      <rect x="-185" y="-105" width="390" height="220" rx="10" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="8,4" />

      <!-- Gold Foil Logo Monogram -->
      <circle cx="-130" cy="-45" r="28" fill="url(#goldFoil)" />
      <text x="-130" y="-36" fill="#0D0D0E" font-family="Impact, sans-serif" font-size="28" font-weight="900" text-anchor="middle">C</text>

      <text x="-85" y="-52" fill="url(#goldFoil)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="2">CRAFTA CREATIVES</text>
      <text x="-85" y="-30" fill="#A1A1AA" font-family="sans-serif" font-size="11" letter-spacing="3">PRINT &amp; PACKAGING STUDIO</text>

      <line x1="-185" y1="15" x2="205" y2="15" stroke="#27272A" stroke-width="1" />

      <text x="-165" y="48" fill="url(#goldFoil)" font-family="sans-serif" font-size="12" font-weight="700">HOT FOIL STAMPING</text>
      <text x="-165" y="68" fill="#71717A" font-family="sans-serif" font-size="11">Custom Die-Cut • Spot UV Gloss • Rigid Boxes</text>

      <!-- Holographic Badge Icon -->
      <circle cx="160" cy="55" r="20" fill="url(#goldFoil)" opacity="0.9" />
      <polygon points="160,42 164,51 173,51 166,57 169,66 160,61 151,66 154,57 147,51 156,51" fill="#0D0D0E" />
    </g>
  </g>

  <!-- Spec Label -->
  <text x="500" y="580" fill="#A1A1AA" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">LUXURY BRAND COLLATERAL • BESPOKE PACKAGING &amp; MERCH</text>
</svg>
