<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="pinkOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF46A2" />
      <stop offset="100%" stop-color="#EE4B2B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Subtle Matrix Grid -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="500" x2="1000" y2="500" />
    <line x1="150" y1="0" x2="150" y2="650" />
    <line x1="350" y1="0" x2="350" y2="650" />
    <line x1="550" y1="0" x2="550" y2="650" />
    <line x1="750" y1="0" x2="750" y2="650" />
    <line x1="900" y1="0" x2="900" y2="650" />
  </g>

  <!-- Glowing Dashboard Window Frame -->
  <rect x="80" y="70" width="840" height="510" rx="18" fill="#111827" fill-opacity="0.85" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Window Top Bar -->
  <rect x="80" y="70" width="840" height="50" rx="18" fill="#1E293B" fill-opacity="0.9" />
  <circle cx="115" cy="95" r="7" fill="#EF4444" />
  <circle cx="138" cy="95" r="7" fill="#F59E0B" />
  <circle cx="161" cy="95" r="7" fill="#10B981" />
  <text x="500" y="100" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">TELEMETRY_ENGINE_V4.2.0 • LIVE REALTIME</text>

  <!-- Metrics Cards -->
  <rect x="120" y="150" width="220" height="95" rx="12" fill="#1E293B" stroke="#334155" />
  <text x="140" y="180" fill="#94A3B8" font-size="12" font-family="sans-serif">Global Throughput</text>
  <text x="140" y="218" fill="#00F0FF" font-size="26" font-weight="bold" font-family="sans-serif">142.8k <tspan font-size="14" fill="#10B981">req/s</tspan></text>

  <rect x="380" y="150" width="220" height="95" rx="12" fill="#1E293B" stroke="#334155" />
  <text x="400" y="180" fill="#94A3B8" font-size="12" font-family="sans-serif">P99 Latency</text>
  <text x="400" y="218" fill="#FF46A2" font-size="26" font-weight="bold" font-family="sans-serif">1.4ms <tspan font-size="14" fill="#00F0FF">-32%</tspan></text>

  <rect x="640" y="150" width="240" height="95" rx="12" fill="#1E293B" stroke="#334155" />
  <text x="660" y="180" fill="#94A3B8" font-size="12" font-family="sans-serif">Cluster Health</text>
  <text x="660" y="218" fill="#10B981" font-size="26" font-weight="bold" font-family="sans-serif">99.999% <tspan font-size="14" fill="#94A3B8">OK</tspan></text>

  <!-- Big Telemetry Wave Graph -->
  <rect x="120" y="275" width="760" height="265" rx="12" fill="#0B132B" fill-opacity="0.6" stroke="#1E293B" />
  <text x="145" y="310" fill="#E2E8F0" font-size="14" font-weight="700" font-family="sans-serif">REAL-TIME TRAFFIC &amp; STREAMING TELEMETRY</text>

  <!-- Wave Path 1 Glow -->
  <path d="M 140 470 Q 230 350, 320 420 T 500 370 T 680 430 T 860 340" fill="none" stroke="#00F0FF" stroke-width="4" filter="url(#glow)" />
  <!-- Wave Path 1 Main -->
  <path d="M 140 470 Q 230 350, 320 420 T 500 370 T 680 430 T 860 340" fill="none" stroke="#00F0FF" stroke-width="3" />
  <!-- Wave Path 2 Secondary Pink -->
  <path d="M 140 490 Q 240 430, 340 470 T 520 410 T 700 480 T 860 390" fill="none" stroke="#FF46A2" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Indicator Pulse Point -->
  <circle cx="680" cy="430" r="6" fill="#FFFFFF" stroke="#00F0FF" stroke-width="3" />
  <circle cx="860" cy="340" r="7" fill="#00F0FF" />
</svg>
