<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="purpleIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#ecomBg)" />

  <!-- Mobile Phone Mockup Center -->
  <g transform="translate(360, 50)">
    <!-- Device Body -->
    <rect width="280" height="550" rx="40" fill="#030712" stroke="#4F46E5" stroke-width="4" />
    <!-- Dynamic Island / Speaker -->
    <rect x="90" y="15" width="100" height="24" rx="12" fill="#1F2937" />

    <!-- App Screen -->
    <rect x="15" y="50" width="250" height="480" rx="28" fill="#18181B" />

    <!-- App Header -->
    <circle cx="45" cy="80" r="14" fill="#374151" />
    <rect x="70" y="74" width="80" height="12" rx="4" fill="#6B7280" />
    <circle cx="235" cy="80" r="14" fill="#4F46E5" />

    <!-- Product Card Feature -->
    <rect x="30" y="120" width="220" height="200" rx="18" fill="#27272A" stroke="#3F3F46" />
    <circle cx="140" cy="200" r="55" fill="url(#purpleIndigo)" opacity="0.8" />
    <text x="140" y="208" fill="#FFFFFF" font-size="32" text-anchor="middle" font-weight="900">AIR</text>
    <text x="45" y="295" fill="#E4E4E7" font-size="14" font-weight="bold">Sneaker Edition X</text>
    <text x="215" y="295" fill="#34D399" font-size="14" font-weight="bold">$280</text>

    <!-- Cart & Instant Buy Button -->
    <rect x="30" y="340" width="220" height="48" rx="14" fill="#818CF8" />
    <text x="140" y="370" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">1-TAP STRIPE PAY</text>

    <!-- Mini Spec List -->
    <rect x="30" y="410" width="100" height="30" rx="8" fill="#27272A" />
    <rect x="150" y="410" width="100" height="30" rx="8" fill="#27272A" />
    <text x="80" y="430" fill="#A1A1AA" font-size="11" text-anchor="middle">FREE SHIP</text>
    <text x="200" y="430" fill="#A1A1AA" font-size="11" text-anchor="middle">INSTANT</text>
  </g>

  <!-- Left Stats Card -->
  <g transform="translate(100, 220)">
    <rect width="200" height="180" rx="18" fill="#1F2937" stroke="#374151" />
    <text x="25" y="45" fill="#9CA3AF" font-size="12" font-weight="bold">CONVERSION RATE</text>
    <text x="25" y="90" fill="#34D399" font-size="34" font-weight="900">8.6%</text>
    <text x="25" y="115" fill="#D1D5DB" font-size="12">vs 2.1% Industry Avg</text>
    <rect x="25" y="135" width="150" height="6" rx="3" fill="#374151" />
    <rect x="25" y="135" width="120" height="6" rx="3" fill="#34D399" />
  </g>

  <!-- Right Performance Card -->
  <g transform="translate(700, 220)">
    <rect width="200" height="180" rx="18" fill="#1F2937" stroke="#374151" />
    <text x="25" y="45" fill="#9CA3AF" font-size="12" font-weight="bold">CHECKOUT SPEED</text>
    <text x="25" y="90" fill="#818CF8" font-size="34" font-weight="900">0.4s</text>
    <text x="25" y="115" fill="#D1D5DB" font-size="12">Headless Edge CDN</text>
    <rect x="25" y="135" width="150" height="6" rx="3" fill="#374151" />
    <rect x="25" y="135" width="140" height="6" rx="3" fill="#818CF8" />
  </g>
</svg>
