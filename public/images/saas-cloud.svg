<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" fill="none">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A20" />
      <stop offset="50%" stop-color="#280C26" />
      <stop offset="100%" stop-color="#09030E" />
    </linearGradient>
    <linearGradient id="pinkFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF46A2" />
      <stop offset="100%" stop-color="#EE4B2B" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#cloudBg)" />

  <!-- Cloud Infrastructure Diagram -->
  <g transform="translate(100, 100)">
    <!-- Central Node (Kubernetes / Rails Engine) -->
    <rect x="280" y="140" width="240" height="160" rx="20" fill="#200A25" stroke="#FF46A2" stroke-width="2" />
    <circle cx="400" cy="200" r="30" fill="url(#pinkFire)" />
    <text x="400" y="255" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">RAILS 8 CLOUD MVP</text>
    <text x="400" y="275" fill="#F472B6" font-family="sans-serif" font-size="12" text-anchor="middle">SOLID QUEUE + SOLID CACHE</text>

    <!-- Node 1: Stripe Webhook -->
    <rect x="40" y="50" width="180" height="80" rx="14" fill="#180B20" stroke="#EE4B2B" />
    <text x="130" y="90" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">STRIPE BILLING</text>
    <text x="130" y="110" fill="#34D399" font-size="11" text-anchor="middle">Automated Webhooks</text>

    <!-- Node 2: PostgreSQL High Availability -->
    <rect x="40" y="310" width="180" height="80" rx="14" fill="#180B20" stroke="#3B82F6" />
    <text x="130" y="350" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">DATABASE HA</text>
    <text x="130" y="370" fill="#60A5FA" font-size="11" text-anchor="middle">PostgreSQL Replica</text>

    <!-- Node 3: Kamal Deploy Container -->
    <rect x="580" y="50" width="180" height="80" rx="14" fill="#180B20" stroke="#00F0FF" />
    <text x="670" y="90" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">KAMAL DEPLOY</text>
    <text x="670" y="110" fill="#00F0FF" font-size="11" text-anchor="middle">Docker Container</text>

    <!-- Node 4: Auth & Security -->
    <rect x="580" y="310" width="180" height="80" rx="14" fill="#180B20" stroke="#FBBF24" />
    <text x="670" y="350" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">AUTH / DEVISE</text>
    <text x="670" y="370" fill="#FDE68A" font-size="11" text-anchor="middle">Passkeys &amp; MFA</text>

    <!-- Connecting Data Lines -->
    <path d="M 220 90 L 320 140" stroke="#EE4B2B" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 220 350 L 320 300" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 580 90 L 480 140" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 580 350 L 480 300" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4,4" />
  </g>
</svg>
